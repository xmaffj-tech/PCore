name: Build PCore

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PCore
        run: msbuild PCore.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
